name: JobSpy
options:
  bundleIdPrefix: dev.intecha
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  JobSpy:
    type: application
    platform: iOS
    sources:
      - JobSpy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.intecha.jobspy
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: JobSpy/Info.plist
      properties:
        CFBundleDevelopmentRegion: it
        CFBundleDisplayName: JobSpy
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        JobSpyAPIURL: $(JOBSPY_API_URL)
        JobSpyAPIKey: $(JOBSPY_API_KEY)
  JobSpyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JobSpyTests
        excludes: [Fixtures]
      - path: JobSpyTests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: JobSpy
schemes:
  JobSpy:
    build:
      targets:
        JobSpy: all
    test:
      targets:
        - JobSpyTests
